<title>Swell Concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500;1,9..144,600&family=Jost:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
  :root{
    --bg:#eae7df;
    --bg-alt:#ded9c9;
    --surface:#f3f1ea;
    --ink:#1c2e2a;
    --ink-soft:#5b6b64;
    --ink-faint:#8b9691;
    --accent:#1c2e2a;
    --accent-soft:#3c5048;
    --on-accent:#eae7df;
    --line:#d5d0bf;
    --line-strong:#bfb89f;
    --shadow: 0 24px 48px -28px rgba(28,46,42,0.45);
    --serif: 'Ogg', 'Fraunces', 'Iowan Old Style', Georgia, serif;
    --serif-ui: 'Century Gothic', 'Jost', 'Futura', 'Avenir Next', sans-serif;
    --maxw: 1360px;
    --gutter: clamp(20px, 4vw, 64px);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--serif-ui);
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; background:none; border:none; color:inherit; cursor:pointer;}
  h1,h2,h3,h4{font-family:var(--serif); font-weight:500; margin:0; text-wrap:balance;}
  img{max-width:100%; display:block;}
  .eyebrow{
    font-family:var(--serif-ui); font-size:0.72rem; letter-spacing:0.18em;
    text-transform:uppercase; color:var(--ink-soft);
  }

  /* ---------- Header ---------- */
  .site-header{
    position:sticky; top:env(safe-area-inset-top, 0px); z-index:40;
    background:var(--bg); border-bottom:1px solid var(--line);
  }
  .header-inner{
    max-width:var(--maxw); margin:0 auto; padding:18px var(--gutter);
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:16px;
  }
  .logo{ display:flex; justify-self:start;}
  .logo img{ height:34px; width:auto; }
  .main-nav{ display:flex; gap:clamp(20px,3vw,44px); justify-self:center;}
  .main-nav a{
    font-size:0.82rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink);
    padding-bottom:4px; border-bottom:1px solid transparent; white-space:nowrap;
  }
  .main-nav a.active, .main-nav a:hover{ border-bottom-color:var(--ink); }
  .header-actions{ display:flex; align-items:center; gap:14px; justify-self:end; position:relative;}
  .icon-btn{ position:relative; display:flex; padding:4px; color:var(--ink);}
  .icon-btn svg{ width:21px; height:21px; }
  .bag-count{
    position:absolute; top:-4px; right:-6px; background:var(--accent); color:var(--on-accent);
    font-size:0.62rem; font-family:var(--serif-ui); width:16px; height:16px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .hamburger{ display:none; padding:4px; }
  .hamburger svg{ width:22px; height:22px; }

  .subnav{
    background:var(--bg); border-bottom:1px solid var(--line);
    display:flex; gap:clamp(24px,4vw,56px); justify-content:center;
    padding:14px var(--gutter);
  }
  .subnav a{ font-size:0.8rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-soft); padding-bottom:4px; border-bottom:1px solid transparent;}
  .subnav a.active{ color:var(--ink); border-bottom-color:var(--ink);}

  /* ---------- Layout helpers ---------- */
  main{ display:block; }
  .wrap{ max-width:var(--maxw); margin:0 auto; padding-inline:var(--gutter); }
  .section{ padding-block:clamp(40px,6vw,88px); }
  .view-all{ font-size:0.78rem; letter-spacing:0.12em; text-transform:uppercase; border-bottom:1px solid var(--ink); padding-bottom:2px; }
  .view-all-row{ text-align:center; margin-top:clamp(28px,4vw,44px); }

  /* ---------- Hero ---------- */
  .hero{ position:relative; }
  .hero img{ width:100%; height:clamp(300px,52vw,560px); object-fit:cover; }

  /* ---------- Collections landing page ---------- */
  .collections-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(24px,4vw,64px); }
  .collections-tile{ display:block; }
  .collections-tile img{ width:100%; aspect-ratio:3/4; object-fit:cover; transition:transform .5s ease; }
  .collections-tile:hover img{ transform:scale(1.02); }
  .collections-tile span{
    display:block; text-align:center; margin-top:18px; font-family:var(--serif);
    font-size:1.05rem; letter-spacing:0.04em; color:var(--ink);
  }

  /* ---------- Category tiles (home) ---------- */
  .cat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:2px; }
  .cat-tile{ position:relative; display:block; overflow:hidden; background:var(--bg-alt);}
  .cat-tile img{ width:100%; aspect-ratio:1/1; object-fit:cover; transition:transform .6s ease;}
  .cat-tile:hover img{ transform:scale(1.045); }
  .cat-tile span{
    position:absolute; left:0; right:0; bottom:0; padding:14px 0; text-align:center;
    font-size:0.78rem; letter-spacing:0.18em; text-transform:uppercase; color:#fff;
    background:linear-gradient(to top, rgba(10,10,6,0.55), transparent);
  }

  /* ---------- Feature tiles (home, alternating widths) ---------- */
  .feature-grid{ display:flex; flex-direction:column; gap:2px; }
  .feature-row img{ width:100%; display:block; }

  /* ---------- Editorial mosaic (complements) ---------- */
  .mosaic{ display:grid; grid-template-columns:repeat(3,1fr); gap:2px; background:var(--line);}
  .mosaic a{ display:block; overflow:hidden; background:var(--bg-alt);}
  .mosaic img{ width:100%; aspect-ratio:4/5; object-fit:cover; transition:transform .6s ease;}
  .mosaic a:hover img{ transform:scale(1.04); }

  /* ---------- Product grid ---------- */
  .p-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(18px,2.5vw,32px); }
  .p-card{ display:flex; flex-direction:column; gap:10px; }
  .p-card-media{ position:relative; display:block; overflow:hidden; background:var(--surface); border:1px solid var(--line);}
  .p-card-media img{ width:100%; aspect-ratio:4/5; object-fit:contain; padding:14px; transition:transform .5s ease;}
  .p-card-media:hover img{ transform:scale(1.03); }
  .p-dots{ position:absolute; bottom:10px; left:0; right:0; display:flex; justify-content:center; gap:5px; }
  .p-dots i{ width:4px; height:4px; border-radius:50%; background:var(--ink-faint); display:block;}
  .p-card-info{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .p-card-name{ font-size:0.85rem; letter-spacing:0.03em; }
  .p-add{ font-size:0.85rem; color:var(--ink-soft); flex:none; }
  .p-add:hover{ color:var(--ink); }
  .p-card-price{ font-size:0.82rem; color:var(--ink-soft); }

  /* ---------- Product detail ---------- */
  .p-detail{ display:grid; grid-template-columns:1.1fr 0.9fr; gap:clamp(32px,6vw,80px); align-items:start; }
  .p-gallery-main{ background:var(--surface); border:1px solid var(--line); }
  .p-gallery-main img{ width:100%; aspect-ratio:1/1; object-fit:contain; padding:24px; }
  .p-thumbs{ display:flex; gap:10px; margin-top:12px; }
  .p-thumb{ width:76px; height:76px; border:1px solid var(--line); background:var(--surface); overflow:hidden; flex:none; }
  .p-thumb.active{ border-color:var(--ink); }
  .p-thumb img{ width:100%; height:100%; object-fit:cover; }
  .p-detail-info h1{ font-size:clamp(1.5rem,2.6vw,2rem); letter-spacing:0.02em; text-transform:uppercase; font-style:normal;}
  .p-price{ font-size:1.15rem; font-family:var(--serif); margin-top:10px; }
  .p-rule{ border:none; border-top:1px solid var(--line); margin:20px 0; }
  .p-desc{ color:var(--ink-soft); max-width:52ch; }
  .p-meta{ margin-top:22px; }
  .p-meta h4{ font-family:var(--serif-ui); font-size:0.78rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-soft); font-weight:500; margin-bottom:4px;}
  .p-avail{ margin-top:24px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .p-avail-status{ font-size:0.9rem; color:var(--accent); display:flex; align-items:center; gap:8px;}
  .p-avail-status::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--accent); display:inline-block;}
  .buy-btn{
    display:inline-flex; align-items:center; gap:10px; font-size:0.82rem; letter-spacing:0.14em;
    text-transform:uppercase; border:1px solid var(--ink); padding:13px 26px; color:var(--ink);
    transition:background .15s, color .15s;
  }
  .buy-btn:hover{ background:var(--ink); color:var(--bg); }
  .back-link{ font-size:0.78rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-soft); display:inline-flex; gap:6px; align-items:center; margin-bottom:26px;}
  .back-link:hover{ color:var(--ink); }

  /* ---------- Limited hero ---------- */
  .limited-hero{ position:relative; }
  .limited-hero img{ width:100%; height:clamp(260px,44vw,480px); object-fit:cover; }

  /* ---------- Projects / about ---------- */
  .about-grid{ display:grid; grid-template-columns:1fr 1fr; gap:clamp(28px,5vw,64px); align-items:center; }
  .about-grid img{ width:100%; aspect-ratio:3/4; object-fit:cover; }
  .about-copy p{ color:var(--ink-soft); margin-top:14px; max-width:48ch; }
  .about-copy h2{ font-size:clamp(1.6rem,3vw,2.3rem); }

  /* ---------- Footer ---------- */
  .site-footer{ margin-top:40px; }
  .footer-media{ position:relative; }
  .footer-media img{ width:100%; height:clamp(220px,32vw,420px); object-fit:cover; }
  .footer-overlay{
    position:absolute; left:0; right:0; bottom:0; padding:20px var(--gutter);
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    background:linear-gradient(to top, rgba(10,12,9,0.6), transparent 70%);
  }
  .footer-overlay .footer-logo{ height:24px; width:auto; filter:brightness(0) invert(1); }
  .footer-overlay span.copyright{ font-size:0.74rem; letter-spacing:0.04em; color:#fff; }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(0); z-index:80;
    background:var(--ink); color:var(--bg); font-size:0.85rem; padding:13px 22px;
    box-shadow:var(--shadow); opacity:1; transition:opacity .25s, transform .25s;
  }
  .toast[hidden]{ display:flex; opacity:0; transform:translateX(-50%) translateY(8px); pointer-events:none;}

  /* ---------- Bag panel ---------- */
  .bag-scrim{ position:fixed; inset:0; background:rgba(20,20,14,0.4); z-index:60; }
  .bag-panel{
    position:fixed; top:0; right:0; bottom:0; width:min(380px,88vw); background:var(--bg); z-index:70;
    box-shadow:var(--shadow); padding:24px; display:flex; flex-direction:column; gap:18px;
    padding-top:calc(24px + env(safe-area-inset-top,0px));
  }
  .bag-panel-head{ display:flex; align-items:center; justify-content:space-between; }
  .bag-panel-head h3{ font-size:1.2rem; }
  .bag-items{ display:flex; flex-direction:column; gap:14px; overflow-y:auto; }
  .bag-line{ display:flex; gap:12px; align-items:center; border-bottom:1px solid var(--line); padding-bottom:14px; }
  .bag-line img{ width:56px; height:56px; object-fit:contain; background:var(--surface); border:1px solid var(--line); padding:6px; flex:none;}
  .bag-line-name{ font-size:0.86rem; flex:1; }
  .bag-line-price{ font-size:0.82rem; color:var(--ink-soft); }
  .bag-remove{ font-size:1rem; color:var(--ink-faint); padding:2px 6px; }
  .bag-empty{ color:var(--ink-soft); font-size:0.9rem; }

  /* ---------- Responsive ---------- */
  @media (max-width: 860px){
    .p-grid{ grid-template-columns:repeat(2,1fr); }
    .p-detail{ grid-template-columns:1fr; }
    .about-grid{ grid-template-columns:1fr; }
    .collections-grid{ grid-template-columns:1fr; gap:32px; }
  }
  @media (max-width: 640px){
    .header-inner{ grid-template-columns:auto 1fr auto; }
    .hamburger{ display:flex; }
    .main-nav{
      position:fixed; top:env(safe-area-inset-top,0px); right:0; bottom:0; left:auto;
      background:var(--bg); flex-direction:column; padding:88px 28px 28px; gap:26px;
      transform:translateX(100%); transition:transform .25s ease; z-index:50; width:70%;
      box-shadow:var(--shadow);
    }
    .main-nav.open{ transform:translateX(0); }
    .main-nav a{ font-size:1rem; }
    .logo{ justify-self:center; align-items:center; }
    .mosaic{ grid-template-columns:repeat(2,1fr); }
    .p-grid{ grid-template-columns:1fr 1fr; gap:14px; }
    .subnav{ gap:22px; }
  }
  @media (max-width: 420px){
    .p-grid{ grid-template-columns:1fr 1fr; }
  }

  [hidden]{ display:none !important; }
</style>

          '<a href="#/product/'+slug+'" class="p-card-name">'+p.name+'</a>' +
          '<button class="p-add" data-add="'+slug+'" aria-label="Add '+p.name+' to bag">+</button>' +
        '</div>' +
        '<div class="p-card-price">'+money(p.price)+'</div>' +
      '</article>';
  }

  /* ---------------- Views ---------------- */

  function viewHome(){
    return '' +
      '<div class="hero">' +
        '<img src="assets/home_hero.jpg" alt="Swell Concept showroom &mdash; curated pieces for everyday spaces">' +
      '</div>' +
      '<div class="cat-grid">' +
        '<a class="cat-tile" href="#/collections/furniture"><img src="assets/cat_furniture.jpg" alt="Furniture"><span>Furniture</span></a>' +
        '<a class="cat-tile" href="#/collections/complements"><img src="assets/cat_complements.jpg" alt="Complements"><span>Complements</span></a>' +
        '<a class="cat-tile" href="#/collections/objects"><img src="assets/cat_objects.jpg" alt="Objects"><span>Objects</span></a>' +
      '</div>' +
      '<div class="feature-grid">' +
        '<div class="feature-row"><img src="assets/feature_row1.jpg" alt="Seating: Moon Stool. Objects: Satellite Bowl."></div>' +
        '<div class="feature-row"><img src="assets/feature_row2.jpg" alt="Antiques: Antique Vase. Sofas: Cozy Sofa."></div>' +
        '<div class="feature-row"><img src="assets/feature_row3.jpg" alt="Complements: Candles. Tables: Phantom Tables."></div>' +
      '</div>';
  }

  function viewCollectionsIndex(){
    return '' +
      '<div class="wrap section">' +
        '<div class="collections-grid">' +
          '<a class="collections-tile" href="#/collections/furniture"><img src="assets/collections_furniture.jpg" alt="Furniture"><span>Furniture</span></a>' +
          '<a class="collections-tile" href="#/collections/complements"><img src="assets/collections_complements.jpg" alt="Complements"><span>Complements</span></a>' +
          '<a class="collections-tile" href="#/collections/objects"><img src="assets/collections_objects.jpg" alt="Objects"><span>Objects</span></a>' +
        '</div>' +
      '</div>';
  }

  function viewCollections(cat){
    if(!CAT_LABEL[cat]) cat = "furniture";
    var items = productsIn(cat);
    var intro = "";
    if(cat === "complements"){
      var mosaicImgs = [
        {img:"g_pillows_1.jpg", slug:"cushion-set-forest"},
        {img:"g_stool.jpg", slug:"handwoven-pouf"},
        {img:"g_curtain.jpg", slug:"ombre-linen-curtain"},
        {img:"g_bench.jpg", slug:"banco-spindale"},
        {img:"g_room.jpg", slug:"leaning-mirror"},
        {img:"g_pillows_2.jpg", slug:"striped-wool-cushions"}
      ];
      intro = '<div class="mosaic">' + mosaicImgs.map(function(m){
        return '<a href="#/product/'+m.slug+'"><img src="assets/'+m.img+'" alt="" loading="lazy"></a>';
      }).join('') + '</div>';
    }
    return intro +
      '<div class="wrap section">' +
        '<div class="p-grid">' + items.map(productCard).join('') + '</div>' +
        '<div class="view-all-row"><a class="view-all" href="#/collections/'+cat+'">View all</a></div>' +
      '</div>';
  }

  function viewProduct(slug){
    var p = PRODUCTS[slug];
    if(!p){ return '<div class="wrap section"><p>Product not found.</p><a class="back-link" href="#/">&larr; Back home</a></div>'; }
    var thumbs = p.thumbs || [p.img];
    return '' +
      '<div class="wrap section">' +
        '<div class="p-detail">' +
          '<div class="p-gallery">' +
            '<div class="p-gallery-main"><img id="pMainImg" src="assets/'+p.img+'" alt="'+p.name+'"></div>' +
            (thumbs.length > 1 ? '<div class="p-thumbs">' + thumbs.map(function(t,i){
              return '<button class="p-thumb'+(i===0?' active':'')+'" data-thumb="'+t+'" aria-label="View image '+(i+1)+'"><img src="assets/'+t+'" alt=""></button>';
            }).join('') + '</div>' : '') +
          '</div>' +
          '<div class="p-detail-info">' +
            '<h1>'+p.name+'</h1>' +
            '<div class="p-price">'+money(p.price)+'</div>' +
            '<hr class="p-rule">' +
            '<p class="p-desc">'+p.desc+'</p>' +
            '<div class="p-meta"><h4>Medidas</h4><p>'+p.measures+'</p></div>' +
            '<div class="p-avail">' +
              '<span class="p-avail-status">Disponible</span>' +
              '<button class="buy-btn" data-add="'+slug+'">Comprar <span>+</span></button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  function viewLimited(){
    var items = Object.keys(PRODUCTS).filter(function(k){ return PRODUCTS[k].limited; });
    return '' +
      '<div class="limited-hero"><img src="assets/hero_limited.jpg" alt="Unique selected pieces from all over"></div>' +
      '<div class="wrap section" style="padding-top:clamp(20px,3vw,32px)">' +
        '<div class="p-grid">' + items.map(productCard).join('') + '</div>' +
        '<div class="view-all-row"><a class="view-all" href="#/collections/furniture">View all</a></div>' +
      '</div>';
  }

  function viewProjects(){
    return '' +
      '<div class="wrap section">' +
        '<div class="about-grid">' +
          '<img src="assets/storefront.jpg" alt="Swell Concept storefront">' +
          '<div class="about-copy">' +
            '<span class="eyebrow">Projects &amp; interiors</span>' +
            '<h2>Every piece starts in a room, not a catalogue.</h2>' +
            '<p>Swell Concept works with a small roster of architects and interior designers on full-space projects &mdash; sourcing reclaimed and handmade furniture, complements and objects piece by piece rather than pulling from a single collection.</p>' +
            '<p>Our storefront on Carrer Major doubles as a working studio: most pieces you see on the floor were chosen for a project first, and made available after.</p>' +
            '<p>To discuss a project, visit us in store or write to <a href="mailto:hola@swellconcept.com" style="border-bottom:1px solid var(--line-strong)">hola@swellconcept.com</a>.</p>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  /* ---------------- Router ---------------- */

  var app = document.getElementById("app");
  var subnav = document.getElementById("subnav");
  var mainNav = document.getElementById("mainNav");

  function setActiveNav(key, cat){
    Array.prototype.forEach.call(mainNav.querySelectorAll("a"), function(a){
      a.classList.toggle("active", a.getAttribute("data-nav") === key);
    });
    Array.prototype.forEach.call(subnav.querySelectorAll("a"), function(a){
      a.classList.toggle("active", a.getAttribute("data-cat") === cat);
    });
  }

  function route(){
    var hash = location.hash.replace(/^#/, "") || "/";
    var parts = hash.split("/").filter(Boolean);
    var html = "";
    subnav.hidden = true;

    if(parts.length === 0){
      html = viewHome();
      setActiveNav("", "");
    } else if(parts[0] === "collections" && !parts[1]){
      html = viewCollectionsIndex();
      setActiveNav("collections", "");
    } else if(parts[0] === "collections"){
      var cat = parts[1];
      html = viewCollections(cat);
      subnav.hidden = false;
      setActiveNav("collections", cat);
    } else if(parts[0] === "product"){
      html = viewProduct(parts[1]);
      var p = PRODUCTS[parts[1]];
      if(p){ subnav.hidden = false; }
      setActiveNav("collections", p ? p.category : "");
    } else if(parts[0] === "limited"){
      html = viewLimited();
      setActiveNav("limited", "");
    } else if(parts[0] === "projects"){
      html = viewProjects();
      setActiveNav("projects", "");
    } else {
      html = viewHome();
      setActiveNav("", "");
    }

    app.innerHTML = html;
    window.scrollTo(0,0);
    closeMobileNav();
    wireProductThumbs();
  }

  window.addEventListener("hashchange", route);

  /* ---------------- Mobile nav ---------------- */

  var hamburgerBtn = document.getElementById("hamburgerBtn");
  function closeMobileNav(){
    mainNav.classList.remove("open");
    hamburgerBtn.setAttribute("aria-expanded", "false");
  }
  hamburgerBtn.addEventListener("click", function(){
    var open = mainNav.classList.toggle("open");
    hamburgerBtn.setAttribute("aria-expanded", open ? "true" : "false");
  });

  /* ---------------- Product gallery thumbs ---------------- */

  function wireProductThumbs(){
    var thumbs = document.querySelectorAll(".p-thumb");
    var mainImg = document.getElementById("pMainImg");
    if(!thumbs.length || !mainImg) return;
    Array.prototype.forEach.call(thumbs, function(t){
      t.addEventListener("click", function(){
        Array.prototype.forEach.call(thumbs, function(x){ x.classList.remove("active"); });
        t.classList.add("active");
        mainImg.src = "assets/" + t.getAttribute("data-thumb");
      });
    });
  }

  /* ---------------- Bag ---------------- */

  var bag = [];
  var bagBtn = document.getElementById("bagBtn");
  var bagPanel = document.getElementById("bagPanel");
  var bagScrim = document.getElementById("bagScrim");
  var bagClose = document.getElementById("bagClose");
  var bagItemsEl = document.getElementById("bagItems");
  var bagEmptyEl = document.getElementById("bagEmpty");
  var bagCountEl = document.getElementById("bagCount");
  var toastEl = document.getElementById("toast");
  var toastTimer = null;

  function renderBag(){
    bagCountEl.hidden = bag.length === 0;
    bagCountEl.textContent = bag.length;
    bagEmptyEl.hidden = bag.length > 0;
    bagItemsEl.innerHTML = bag.map(function(slug, i){
      var p = PRODUCTS[slug];
      return '<div class="bag-line">' +
        '<img src="assets/'+p.img+'" alt="">' +
        '<div style="flex:1"><div class="bag-line-name">'+p.name+'</div><div class="bag-line-price">'+money(p.price)+'</div></div>' +
        '<button class="bag-remove" data-remove="'+i+'" aria-label="Remove">&times;</button>' +
      '</div>';
    }).join('');
  }

  function openBag(){ bagPanel.hidden = false; bagScrim.hidden = false; }
  function closeBag(){ bagPanel.hidden = true; bagScrim.hidden = true; }

  bagBtn.addEventListener("click", openBag);
  bagClose.addEventListener("click", closeBag);
  bagScrim.addEventListener("click", closeBag);

  bagItemsEl.addEventListener("click", function(e){
    var btn = e.target.closest("[data-remove]");
    if(!btn) return;
    bag.splice(Number(btn.getAttribute("data-remove")), 1);
    renderBag();
  });

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.hidden = true; }, 2200);
  }

  document.addEventListener("click", function(e){
    var btn = e.target.closest("[data-add]");
    if(!btn) return;
    e.preventDefault();
    var slug = btn.getAttribute("data-add");
    var p = PRODUCTS[slug];
    if(!p) return;
    bag.push(slug);
    renderBag();
    showToast(p.name + " added to your bag");
  });

  /* ---------------- Init ---------------- */

  renderBag();
  route();
})();
</script>
